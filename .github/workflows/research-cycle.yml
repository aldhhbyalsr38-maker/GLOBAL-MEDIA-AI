name: Global Media AI - Research Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0,12 * * *"

permissions:
  contents: read

concurrency:
  group: global-media-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run research cycle
        run: python -m global_media_ai --config config/settings.json --output output

      - name: Create production packs
        run: python -m global_media_ai.production_cli --input output/editorial_plan.json --output production

      - name: Upload editorial and production packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-and-production-${{ github.run_number }}
          path: |
            output/
            production/
          if-no-files-found: warn
          retention-days: 14
